[build]
  command = "corepack pnpm run build:landing"
  publish = "apps/landing/dist"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "12.3.4"

[[headers]]
  for = "/*"

  [headers.values]
    # Inline attributes carry prerendered progress/delay values. Script execution
    # stays same-origin; style blocks must come from the bundled stylesheet.
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"
