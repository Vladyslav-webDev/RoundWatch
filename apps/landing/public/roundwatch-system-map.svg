<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" role="img" aria-labelledby="title desc">
  <title id="title">RoundWatch system architecture</title>
  <desc id="desc">A system map showing a client purchasing a bounded watch through x402 and GoPlausible on Algorand MainNet, while RoundWatch persists state, reconciles settlement, observes the Indexer, and returns exact payment evidence later.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151513"/>
      <stop offset="1" stop-color="#0c0d0c"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17120f"/>
      <stop offset="1" stop-color="#0e0e0d"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff642d" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ff642d" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff642d"/>
    </marker>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d9d5cc"/>
    </marker>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;fill:#f5f3ee}
      .micro{font:500 9px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.1em;fill:#8f918f}
      .copy{font:500 11px Arial,sans-serif;fill:#a7a8a4}
      .node{fill:#101110;stroke:#3a3935;stroke-width:1}
      .nodeStrong{fill:#121210;stroke:#6b442f;stroke-width:1}
      .service{fill:none;stroke:#ff642d;stroke-width:1.7;marker-end:url(#arrowOrange)}
      .evidence{fill:none;stroke:#d9d5cc;stroke-opacity:.72;stroke-width:1.35;marker-end:url(#arrowLight)}
      .internal{fill:none;stroke:#65584d;stroke-width:1}
      .dash{stroke-dasharray:5 7}
      .pulseOrange{fill:#ffe1cf;filter:url(#softGlow)}
      .pulseLight{fill:#f5f3ee;filter:url(#softGlow)}
      @media (prefers-reduced-motion:no-preference){
        .pulseA{animation:pulseA 6s linear infinite}
        .pulseB{animation:pulseB 7.4s linear infinite}
        @keyframes pulseA{0%{offset-distance:0%;opacity:0}8%{opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}
        @keyframes pulseB{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
      }
    </style>
  </defs>

  <rect width="920" height="700" fill="transparent"/>
  <circle cx="462" cy="322" r="210" fill="url(#glow)" opacity=".12"/>

  <text x="32" y="34" class="micro">ROUNDWATCH / SYSTEM MAP</text>
  <text x="888" y="34" text-anchor="end" class="micro">ALGORAND MAINNET</text>

  <!-- Client -->
  <rect x="34" y="172" width="172" height="92" rx="3" class="node"/>
  <text x="55" y="201" class="label">AGENT / CLIENT</text>
  <text x="55" y="224" class="copy">defines exact payment</text>
  <text x="55" y="244" class="copy">signs locally · can exit</text>

  <!-- RoundWatch boundary -->
  <rect x="278" y="88" width="418" height="448" rx="4" fill="url(#panel)" stroke="#494640" stroke-width="1"/>
  <text x="300" y="117" class="label">ROUNDWATCH</text>
  <text x="674" y="117" text-anchor="end" class="micro">DURABLE SERVICE BOUNDARY</text>

  <!-- API -->
  <rect x="314" y="146" width="346" height="78" rx="3" class="nodeStrong"/>
  <text x="336" y="174" class="label">API + x402 LIFECYCLE</text>
  <text x="336" y="198" class="copy">402 requirements · verified retry · watch status</text>

  <!-- Store -->
  <ellipse cx="487" cy="307" rx="82" ry="20" fill="#151310" stroke="#815038"/>
  <rect x="405" y="307" width="164" height="68" fill="#151310" stroke="#815038"/>
  <ellipse cx="487" cy="375" rx="82" ry="20" fill="#11110f" stroke="#815038"/>
  <ellipse cx="487" cy="307" rx="82" ry="20" fill="#17130f" stroke="#a75d36"/>
  <text x="487" y="313" text-anchor="middle" class="label">DURABLE STATE</text>
  <text x="487" y="344" text-anchor="middle" class="copy">SQLite · watch lifecycle</text>
  <text x="487" y="362" text-anchor="middle" class="copy">cursor · settlement · evidence</text>

  <!-- Workers -->
  <rect x="314" y="421" width="158" height="76" rx="3" class="node"/>
  <text x="333" y="449" class="label">SETTLEMENT</text>
  <text x="333" y="466" class="label">RECOVERY</text>
  <text x="333" y="486" class="copy">exact tx reconciliation</text>

  <rect x="502" y="421" width="158" height="76" rx="3" class="node"/>
  <text x="521" y="449" class="label">WATCH</text>
  <text x="521" y="466" class="label">OBSERVER</text>
  <text x="521" y="486" class="copy">bounded exact matching</text>

  <!-- External services -->
  <rect x="34" y="454" width="172" height="82" rx="3" class="node"/>
  <text x="55" y="482" class="label">GOPLAUSIBLE</text>
  <text x="55" y="502" class="copy">x402 facilitator</text>
  <text x="55" y="520" class="copy">verify + settle</text>

  <rect x="742" y="390" width="144" height="82" rx="3" class="node"/>
  <text x="762" y="418" class="label">ALGORAND</text>
  <text x="762" y="435" class="label">INDEXER</text>
  <text x="762" y="456" class="copy">confirmed chain view</text>

  <rect x="714" y="544" width="172" height="82" rx="3" class="nodeStrong"/>
  <text x="735" y="573" class="label">ALGORAND MAINNET</text>
  <text x="735" y="596" class="copy">service settlement +</text>
  <text x="735" y="614" class="copy">future USDC payment</text>

  <!-- Internal state connections -->
  <path d="M487 224 L487 286" class="internal"/>
  <path d="M393 421 L438 390" class="internal"/>
  <path d="M581 421 L536 390" class="internal"/>
  <path d="M393 421 L393 251 L455 224" class="internal dash" opacity=".6"/>
  <path d="M581 421 L581 251 L519 224" class="internal dash" opacity=".6"/>

  <!-- Service-payment route -->
  <path id="servicePath" d="M206 205 C238 205 257 185 314 185 M314 185" class="service"/>
  <path d="M314 186 C250 206 247 486 206 494" class="service"/>
  <path d="M206 494 C316 575 558 586 714 586" class="service"/>
  <text x="218" y="165" class="micro" fill="#ff8a5c">WATCH PURCHASE / X402</text>
  <text x="300" y="568" class="micro" fill="#ff8a5c">SERVICE SETTLEMENT</text>

  <!-- Evidence route -->
  <path d="M714 586 C704 532 730 486 778 472" class="evidence"/>
  <path d="M742 431 C690 431 682 458 660 458" class="evidence"/>
  <path d="M742 447 C692 482 687 458 472 458" class="evidence"/>
  <path d="M502 458 C488 418 487 404 487 395" class="evidence"/>
  <path d="M405 341 C331 327 292 281 314 203" class="evidence"/>
  <path d="M314 203 C261 219 247 232 206 232" class="evidence"/>
  <text x="690" y="365" class="micro">CONFIRMED EVIDENCE</text>
  <text x="217" y="286" class="micro">STATUS / MATCH</text>

  <!-- Animated signal dots -->
  <circle r="4" class="pulseOrange pulseA">
    <animateMotion dur="6s" repeatCount="indefinite" path="M206 205 C238 205 257 185 314 185"/>
  </circle>
  <circle r="4" class="pulseLight pulseB">
    <animateMotion dur="7.4s" repeatCount="indefinite" path="M714 586 C704 532 730 486 778 472 C705 438 690 454 660 458 C607 446 544 430 502 458 C490 421 487 406 487 395"/>
  </circle>

  <!-- Narrative footer -->
  <line x1="34" y1="657" x2="886" y2="657" stroke="#2f2f2c"/>
  <text x="34" y="682" class="micro" fill="#d4d0c7">PAY ONCE</text>
  <text x="144" y="682" class="micro" fill="#ff642d">→</text>
  <text x="180" y="682" class="micro" fill="#d4d0c7">CALLER EXITS</text>
  <text x="318" y="682" class="micro" fill="#ff642d">→</text>
  <text x="354" y="682" class="micro" fill="#d4d0c7">ROUNDWATCH WAITS</text>
  <text x="520" y="682" class="micro" fill="#ff642d">→</text>
  <text x="556" y="682" class="micro" fill="#d4d0c7">EXACT PAYMENT APPEARS</text>
  <text x="747" y="682" class="micro" fill="#ff642d">→</text>
  <text x="783" y="682" class="micro" fill="#d4d0c7">EVIDENCE PERSISTS</text>
</svg>
