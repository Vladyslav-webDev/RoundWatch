name: CI

on:
  push:
    branches:
      - main
      - hardening/mainnet-readiness
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Full-history secret scan
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.29.1 \
            git --redact --no-banner /repo

      - name: Reject tracked environment secrets
        shell: bash
        run: |
          set -euo pipefail
          bad_files=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$bad_files" ]; then
            echo "Tracked environment files are forbidden:"
            echo "$bad_files"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: RoundWatch focused tests
        run: pnpm -C apps/server test

      - name: MainNet client safety tests
        run: pnpm -C apps/client test

      - name: Build production container
        run: docker build -t roundwatch-ci .

      - name: Temporary production Bazaar 402 smoke
        shell: bash
        run: |
          set -euo pipefail
          headers=$(mktemp)
          body=$(mktemp)
          status=$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' \
            -X POST 'https://roundwatch-api.onrender.com/v1/watch' \
            -H 'Content-Type: application/json' \
            --data '{"idempotencyKey":"gha-postdeploy-bazaar-smoke-001","expectedSender":"EQPLN32HPLPGBCNPOZUL6BL34CTNQGT3VAAMNAJWSIZGQ5CUNXOHB634XY","expectedReceiver":"EQPLN32HPLPGBCNPOZUL6BL34CTNQGT3VAAMNAJWSIZGQ5CUNXOHB634XY","atomicAmount":"1","invoiceNote":"roundwatch:gha-postdeploy-bazaar-smoke-001"}')
          test "$status" = "402"
          payment_required=$(awk 'BEGIN{IGNORECASE=1} /^payment-required:/ {sub(/\r$/, ""); sub(/^[^:]*:[[:space:]]*/, ""); print; exit}' "$headers")
          test -n "$payment_required"
          PAYMENT_REQUIRED="$payment_required" node <<'NODE'
          const encoded = process.env.PAYMENT_REQUIRED;
          const decoded = JSON.parse(Buffer.from(encoded, 'base64').toString('utf8'));
          const accepted = decoded.accepts?.[0];
          const example = decoded.extensions?.bazaar?.info?.input?.body;
          const expectedNetwork = 'algorand:wGHE2Pwdvd7S12BL5FaOP20EGYesN73ktiC1qzkkit8=';
          const expectedReceiver = 'AEAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAEA5RCDXMI';
          const expectedSender = 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAY5HFKQ';
          if (decoded.resource?.url !== 'https://roundwatch-api.onrender.com/v1/watch') throw new Error('wrong resource URL');
          if (accepted?.scheme !== 'exact') throw new Error('wrong scheme');
          if (accepted?.network !== expectedNetwork) throw new Error('wrong network');
          if (accepted?.amount !== '1000') throw new Error('wrong amount');
          if (accepted?.asset !== '31566704') throw new Error('wrong asset');
          if (example?.expectedSender !== expectedSender) throw new Error('wrong Bazaar sender example');
          if (example?.expectedReceiver !== expectedReceiver) throw new Error('wrong Bazaar receiver example');
          console.log('production-bazaar-smoke-ok');
          NODE
