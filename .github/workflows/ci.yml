name: CI

on:
  push:
    branches:
      - main
      - hardening/mainnet-readiness
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Full-history secret scan
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.29.1 \
            git --redact --no-banner --log-opts="--full-history --diff-filter=tuxdb HEAD" /repo

      - name: Reject tracked environment secrets
        shell: bash
        run: |
          set -euo pipefail
          bad_files=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$bad_files" ]; then
            echo "Tracked environment files are forbidden:"
            echo "$bad_files"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Verify live RoundWatch /start economics copy
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const response = await fetch('https://roundwatch.observer/start', {
            headers: { 'user-agent': 'roundwatch-postdeploy-smoke/1.0' },
          });
          if (!response.ok) {
            throw new Error(`Expected 2xx from /start, got ${response.status}`);
          }
          const html = await response.text();

          const required = [
            '0.02 USDC service fee',
            '500 durable background turns',
            'indeterminate',
          ];
          for (const text of required) {
            if (!html.includes(text)) {
              throw new Error(`Live /start is missing expected copy: ${text}`);
            }
          }
          if (html.includes('0.001 USDC service fee')) {
            throw new Error('Live /start still exposes the retired 0.001 USDC service fee');
          }

          console.log('LANDING_SMOKE_OK', JSON.stringify({
            status: response.status,
            hasPrice: true,
            hasWorkBudget: true,
            hasIndeterminate: true,
            oldServiceFeeAbsent: true,
          }));
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: RoundWatch focused tests
        run: pnpm -C apps/server test

      - name: MainNet client safety tests
        run: pnpm -C apps/client test

      - name: Build production container
        run: docker build -t roundwatch-ci .
