name: CI

on:
  push:
    branches:
      - main
      - hardening/mainnet-readiness
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Full-history secret scan
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a \
            git --redact --no-banner --log-opts="--full-history --diff-filter=tuxdb HEAD" /repo

      - name: Reject tracked environment secrets
        shell: bash
        run: |
          set -euo pipefail
          bad_files=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$bad_files" ]; then
            echo "Tracked environment files are forbidden:"
            echo "$bad_files"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Typecheck
        run: pnpm typecheck

      - name: RoundWatch focused tests
        run: pnpm -C apps/server test

      - name: MainNet client safety tests
        run: pnpm -C apps/client test

      - name: Canonical transaction-size probe
        run: pnpm -C apps/client probe:txn-size

      - name: Build production container
        run: docker build -t roundwatch-ci .
